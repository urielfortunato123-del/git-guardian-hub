name: Build ViaShield v0.2

on:
  push:
    branches:
      - viashield-build-v020

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild source
        shell: bash
        run: |
          set -euxo pipefail
          cat viashield-build/xzchunk1.b64 viashield-build/xzchunk2.b64 viashield-build/xzchunk3.b64 > /tmp/v.b64
          base64 -d /tmp/v.b64 > /tmp/v.tar.xz
          mkdir -p /tmp/vsrc
          tar -xJf /tmp/v.tar.xz -C /tmp/vsrc
          test -f /tmp/vsrc/ViaShield_DNS/settings.gradle.kts

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        working-directory: /tmp/vsrc/ViaShield_DNS
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ViaShield-DNS-v0.2.0
          path: /tmp/vsrc/ViaShield_DNS/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
